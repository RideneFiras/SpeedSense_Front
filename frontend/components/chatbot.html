<!-- Ask SpeedSense Section Start -->
<div class="our-potential" id="ask-speedsense" >
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-12">
                <!-- Ask SpeedSense Content Start -->
                <div class="our-potential-content">
                    <!-- Section Title Start -->
                    <div class="section-title" style="color: #ffffff;">
                        <h3 class="wow fadeInUp" style="color: #7621ff;">Interactive Support</h3>
                        <div class="wow fadeInUp" data-wow-delay="0.2s" style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
                            <div style="font-size: 40px;">💬</div>
                            <h2 data-cursor="-opaque" style="margin: 0;">Ask <span style="color: #4e92ff;">Speed</span><span style="color: #9152e0;">Sense</span> Anything</h2>
                        </div>
                    </div>
                    <!-- Section Title End -->
                    
                    <!-- Ask SpeedSense Form Start -->
                    <div class="wow fadeInUp" data-wow-delay="0.4s">

                                    <i class="fa-solid fa-paper-plane"></i> Ask

<style>
.ask-form-box {
    position: relative;
    margin-top: 30px;
}

.ask-form-box .input-group {
    display: flex;
    align-items: center;
}

.ask-form-box .form-control {

    background: #2d2a3a;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 0 25px;
    font-size: 16px;
    color: #ffffff;
    box-shadow: none;
    transition: all 0.3s ease;
    margin-right: 10px;
    flex-grow: 1;

.ask-form-box .form-control:focus {

}

.ask-form-box .btn {

    height: 60px;
    background: #7621ff;
    color: #fff;
    border-radius: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
    border: none;
    outline: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    visibility: visible !important; /* Ensure always visible */
    opacity: 1 !important; /* Ensure fully opaque */
}

.ask-form-box .btn:hover {
    background: #8a45ff;
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(118, 33, 255, 0.3);
}

.conversation-item {
    background: #2d2a3a;
    padding: 25px;
    border-radius: 15px;
    margin-top: 20px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    border-left: 4px solid #7621ff;
    position: relative;
    margin-bottom: 25px;
}

.user-question {
    font-weight: 600;
    color: #9152e0;
    margin-bottom: 15px;
    font-size: 17px;
    display: flex;
    align-items: center;
}

.user-question:before {
    content: "Q:";
    margin-right: 10px;
    background: #9152e0;
    color: #fff;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
}

.ai-response {
    color: #e0e0e0;
    line-height: 1.7;
    font-size: 16px;
    position: relative;
    padding-left: 34px;
}

.ai-response:before {
    content: "A:";
    position: absolute;
    left: 0;
    background: #4e92ff;
    color: #fff;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
}

/* Fix selection color issue */
#conversationHistory ::selection {
    background-color: #7621ff;
    color: #ffffff;
}

/* Responsive adjustments */
@media (max-width: 767px) {
    .ask-form-box .input-group {
        flex-direction: column;
    }
    
    .ask-form-box .form-control {
        width: 100%;
        margin-right: 0;
        margin-bottom: 15px;
    }
    
    .ask-form-box .btn {
        width: 100%;
    }
}

.loading-dots {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 30px;
    padding: 20px 0;
}

.loading-dots span {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: #7621ff;
    margin: 0 5px;
    opacity: 0.6;
    animation: loadingDots 1.4s infinite ease-in-out both;
}

.loading-dots span:nth-child(1) {
    animation-delay: -0.32s;
}

.loading-dots span:nth-child(2) {
    animation-delay: -0.16s;
}

@keyframes loadingDots {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
}

/* Animation for new conversation items */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.fade-in-up {
    animation: fadeInUp 0.5s ease forwards;
}
</style>

<script>
// Store conversation history
let conversationHistory = [];

// Function to handle the question submission
async function sendQuestion() {
    const userInput = document.getElementById("userInput");
    const question = userInput.value.trim();
    const conversationContainer = document.getElementById("conversationHistory");
    
    if (!question) return;
    
    // Create a new conversation item
    const conversationItem = document.createElement("div");
    conversationItem.className = "conversation-item fade-in-up";
    conversationItem.id = `conversation-${Date.now()}`;
    
    // Add the question
    const questionElement = document.createElement("div");
    questionElement.className = "user-question";
    questionElement.textContent = question;
    conversationItem.appendChild(questionElement);
    
    // Add loading indicator
    const loadingElement = document.createElement("div");
    loadingElement.className = "loading-dots";
    loadingElement.innerHTML = '<span></span><span></span><span></span>';
    conversationItem.appendChild(loadingElement);
    
    // Add to DOM
    conversationContainer.insertBefore(conversationItem, conversationContainer.firstChild);
    
    // Clear input
    userInput.value = "";
    
    try {
        // Send the question to the server
        const res = await fetch("/faq-chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question })
        });
        
        if (!res.ok) {
            throw new Error("Network response was not ok");
        }
        
        const data = await res.json();
        
        // Remove loading indicator
        conversationItem.removeChild(loadingElement);
        
        // Add the response
        const responseElement = document.createElement("div");
        responseElement.className = "ai-response";
        responseElement.textContent = data.response;
        conversationItem.appendChild(responseElement);
        
        // Store in history
        conversationHistory.push({
            question: question,
            response: data.response
        });
        
    } catch (error) {
        // Remove loading indicator
        conversationItem.removeChild(loadingElement);
        
        // Add error message
        const errorElement = document.createElement("div");
        errorElement.className = "ai-response";
        errorElement.textContent = "Sorry, I couldn't find a relevant answer. Please try rephrasing your question or contact us on Contact@speedsense.me.";
        conversationItem.appendChild(errorElement);
    }
}

// Allow pressing Enter key to submit
document.getElementById("userInput").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        sendQuestion();
    }
});

// Add example Q&A to demonstrate how it looks

    const askButton = document.getElementById('askButton');
    
    // Ensure the button is always visible
    if (askButton) {
        askButton.style.visibility = 'visible';
        askButton.style.opacity = '1';
    }

});
</script>
